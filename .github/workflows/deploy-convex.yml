name: Deploy Convex

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "packages/backend/**"
      - "packages/typescript-config/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Deploy Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ github.ref == 'refs/heads/main' && secrets.CONVEX_DEPLOY_KEY_PROD || secrets.CONVEX_DEPLOY_KEY_DEV }}
        run: |
          cd packages/backend
          bunx convex deploy --cmd 'bun run build'
