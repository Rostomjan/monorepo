name: Factory

# THE FACTORY: one workflow, one job graph.
#
# PR path:  changes -> triage -> two reviewer agents ----\
#                 \-> full pipeline (lint/build/docker/e2e) -> merge gate
#           Low-impact PRs squash-merge themselves when everything upstream
#           is green and authorization still holds; everything else ends
#           green with the decision, and a human decides. Red = machinery
#           failure (reviewer crash, unreadable state), not "reviewer said no".
#
# Push path (main/develop): same pipeline jobs + the deploy jobs; review,
#   triage and merge are PR-only jobs and skip.
#
# Tiering is job-level, not `paths-ignore`: the `detect` job outputs
# `docs_only`, `check` conditionally skips, and every pipeline job that
# `needs: check` skips with it — natively, through the job graph. Reviewers
# still run on docs-only diffs (their approval is the gate there).
#
# Why the old Gate's poll loop is gone: the merge job uses `needs:` edges as
# the wait. GitHub fires it the instant upstream jobs conclude — no polling
# cadence, no wall-clock deadline, and a stuck foreign check (Vercel) can no
# longer stall the gate, because only THIS workflow's jobs are in the wait
# set. Foreign preview deployments are advisory and never block a merge.
#
# Setup: docs/PR-GATE.md. One-time: `bash scripts/set-branch-protection.sh`.

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  # Workflow token scope is REPLACED by this block, not unioned: only what
  # the jobs below use. No checks/actions reads — the needs-graph replaces
  # the old cross-workflow status reads.
  contents: write      # merge gate squash-merges and deletes merged branches
  issues: write        # labels are issue resources (triage + reviewer stamps)
  pull-requests: write # diffs, comments, merge

concurrency:
  # Cancel superseded PR runs; never cancel main/develop deploys.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.4.3"
  # Swap reviewer models via repo variables without touching this file.
  FAST_MODEL: ${{ vars.REVIEW_FAST_MODEL || 'opencode/glm-5.3-flash-free' }}
  STRONG_MODEL: ${{ vars.REVIEW_STRONG_MODEL || 'opencode/deepseek-v4.1-flash-free#high' }}
  # Branches the merge gate may auto-merge into. Remove "main" to keep prod
  # merges human.
  AUTO_MERGE_TARGETS: "develop main"
  # Diff size under which the gate may auto-merge (additions + deletions).
  MAX_DIFF_LINES: "400"

jobs:
  detect:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - name: Detect tier
        env:
          GH_TOKEN: ${{ github.token }}
        id: detect
        run: |
          REPO="${{ github.repository }}"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          data=$(gh pr view "${{ github.event.pull_request.number }}" --repo "$REPO" --json files)
          # Same doc-scope the pipeline used to encode in paths-ignore:
          # docs/** plus *.md/*.mdx anywhere.
          docs_only=$(jq -r '[.files[].path] | length == 0 or all(test("^(docs/|.*\\.(md|mdx)$)")) | tostring' <<< "$data")
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Docs-only tier: $docs_only"

  triage:
    name: Triage impact
    needs: detect
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mergeable: ${{ steps.triage.outputs.mergeable }}
    steps:
      - name: Classify PR
        env:
          GH_TOKEN: ${{ github.token }}
        id: triage
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          add_label()    { gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$1" > /dev/null; }
          create_label() { gh api -X POST "repos/$REPO/labels" -f name="$1" -f color="$2" -f description="$3" > /dev/null 2>&1 || true; }
          remove_label() { gh api -X DELETE "repos/$REPO/issues/$PR/labels/${1//:/%3A}" > /dev/null 2>&1 || true; }

          create_label "auto-merge" "0e8a16" "Triage: low impact, agent-approved"
          create_label "needs-human" "dedede" "Triage: human review required"
          create_label "review-fast:approved" "0e8a16" "Fast reviewer approved"
          create_label "review-fast:changes" "d93f0b" "Fast reviewer requested changes"
          create_label "review-strong:approved" "0e8a16" "Strong reviewer approved"
          create_label "review-strong:changes" "d93f0b" "Strong reviewer requested changes"

          data=$(gh pr view "$PR" --repo "$REPO" --json files,additions,deletions)
          lines=$(($(echo "$data" | jq -r '.additions') + $(echo "$data" | jq -r '.deletions')))

          mergeable=true
          deny_regex='^(packages/backend/|\.github/|infra/|docker-compose\.yml$|\.env)'
          for path in $(echo "$data" | jq -r '.files[].path'); do
            if echo "$path" | grep -qE "$deny_regex"; then
              echo "Deny path touched: $path"
              mergeable=false
            fi
          done

          # Bigger diffs are only low-impact if they are entirely docs/config/deps.
          if [ "$lines" -gt "${{ env.MAX_DIFF_LINES }}" ]; then
            docs_regex='^(docs/|README|\.env\.example|package\.json$|bun\.lock$)'
            for path in $(echo "$data" | jq -r '.files[].path'); do
              if ! echo "$path" | grep -qE "$docs_regex"; then
                echo "Large diff (${lines} lines) touches non-docs file: $path"
                mergeable=false
              fi
            done
          fi

          if [ "$mergeable" = "true" ]; then
            add_label "auto-merge"
            remove_label "needs-human" || true
          else
            add_label "needs-human"
            remove_label "auto-merge" || true
          fi

          echo "mergeable=$mergeable" >> "$GITHUB_OUTPUT"
          echo "Triage verdict: $mergeable (${lines} changed lines)"

  review-fast:
    name: Review - fast sweep
    needs: detect
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" > /tmp/pr.diff
          gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --json title,body \
            --jq '"# PR title\n\n" + .title + "\n\n# PR description\n\n" + (.body // "none provided")' \
            > /tmp/pr.intent
      - name: Install opencode
        # npm `opencode-ai@latest` is still V1, which rejects V2 config.
        # V2 comes from the official installer. GITHUB_PATH only takes effect
        # in the NEXT step, so assert via the explicit binary path here.
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version
      - name: Run fast reviewer
        env:
          # Default models on the `opencode` free provider need no credential.
          # Set the secret only if a reviewer model requires auth.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          add_label()    { gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$1" > /dev/null; }
          remove_label() { gh api -X DELETE "repos/$REPO/issues/$PR/labels/${1//:/%3A}" > /dev/null 2>&1 || true; }

          remove_label "review-fast:approved"
          remove_label "review-fast:changes"

          # An empty OPENCODE_API_KEY (secret unset) can be treated as an
          # invalid token by providers; only expose it when configured.
          if [ -z "$OPENCODE_API_KEY" ]; then unset OPENCODE_API_KEY; fi

          set +e
          opencode run --format json --agent review-fast -m "$FAST_MODEL" \
            --title "pr-$PR-review-fast" \
            --file /tmp/pr.diff \
            --file /tmp/pr.intent \
            "You are reviewing a pull request in a monorepo. The first attached file is the full diff; the second contains the PR title and description. Follow your agent instructions exactly." \
            > /tmp/review.jsonl 2>/tmp/review.err
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            # With --format json, opencode writes provider/CLI errors to
            # stdout as a {"type":"error"} JSONL line and often leaves
            # stderr EMPTY (free-tier route outages look exactly like
            # this). Diagnose from both, never post a blank body.
            detail=$(tail -15 /tmp/review.err 2>/dev/null || true)
            errline=$(jq -r 'select(.type=="error") | (.error.message // .message // empty)' /tmp/review.jsonl 2>/dev/null || true)
            report="rc=$rc | stderr: ${detail:-<none>} | error line: ${errline:-<none>}"
            echo "opencode run failed: $report" >&2
            {
              echo "**Fast reviewer crashed** on ${{ github.event.pull_request.head.sha }}"
              echo ""
              echo '```'
              echo "$report"
              echo '```'
            } > /tmp/crash.md
            gh pr comment "$PR" --body-file /tmp/crash.md || true
            exit 1
          fi

          jq -r 'select(.type=="text") | (.part.text // .text // empty)' /tmp/review.jsonl > /tmp/review.md 2>/dev/null || true

          if ! grep -q "VERDICT: " /tmp/review.md; then
            echo "Reviewer ran but produced no verdict" >&2
            gh pr comment "$PR" \
              --body "**Fast reviewer returned no verdict** on ${{ github.event.pull_request.head.sha }}. Final message:" || true
            gh pr comment "$PR" --body "$(tail -40 /tmp/review.md 2>/dev/null || echo 'empty')" || true
            exit 1
          fi

          if grep -q "VERDICT: APPROVED" /tmp/review.md; then
            add_label "review-fast:approved"
            remove_label "review-fast:changes" || true
          else
            add_label "review-fast:changes"
            remove_label "review-fast:approved" || true
            gh pr comment "$PR" \
              --body "**Fast reviewer requested changes** on commit ${{ github.event.pull_request.head.sha }}:" || true
            gh pr comment "$PR" --body-file /tmp/review.md || true
          fi

  review-strong:
    name: Review - intent (strong)
    needs: detect
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" > /tmp/pr.diff
          gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --json title,body \
            --jq '"# PR title\n\n" + .title + "\n\n# PR description\n\n" + (.body // "none provided")' \
            > /tmp/pr.intent
      - name: Install opencode
        # npm `opencode-ai@latest` is still V1, which rejects V2 config.
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version
      - name: Run strong reviewer
        env:
          # Default models on the `opencode` free provider need no credential.
          # Set the secret only if a reviewer model requires auth.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          add_label()    { gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$1" > /dev/null; }
          remove_label() { gh api -X DELETE "repos/$REPO/issues/$PR/labels/${1//:/%3A}" > /dev/null 2>&1 || true; }

          remove_label "review-strong:approved"
          remove_label "review-strong:changes"

          # An empty OPENCODE_API_KEY (secret unset) can be treated as an
          # invalid token by providers; only expose it when configured.
          if [ -z "$OPENCODE_API_KEY" ]; then unset OPENCODE_API_KEY; fi

          set +e
          opencode run --format json --agent review-strong -m "$STRONG_MODEL" \
            --title "pr-$PR-review-strong" \
            --file /tmp/pr.diff \
            --file /tmp/pr.intent \
            "You are reviewing a pull request in a monorepo. The first attached file is the full diff; the second contains the PR title and description, which is the stated intent. Follow your agent instructions exactly." \
            > /tmp/review.jsonl 2>/tmp/review.err
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            # Same diagnosis logic as the fast reviewer: both stderr (CLI
            # failures) and the stdout {"type":"error"} line (provider
            # outages). Body-file prevents a blank-body cascade.
            detail=$(tail -15 /tmp/review.err 2>/dev/null || true)
            errline=$(jq -r 'select(.type=="error") | (.error.message // .message // empty)' /tmp/review.jsonl 2>/dev/null || true)
            report="rc=$rc | stderr: ${detail:-<none>} | error line: ${errline:-<none>}"
            echo "opencode run failed: $report" >&2
            {
              echo "**Strong reviewer crashed** on ${{ github.event.pull_request.head.sha }}"
              echo ""
              echo '```'
              echo "$report"
              echo '```'
            } > /tmp/crash.md
            gh pr comment "$PR" --body-file /tmp/crash.md || true
            exit 1
          fi

          jq -r 'select(.type=="text") | (.part.text // .text // empty)' /tmp/review.jsonl > /tmp/review.md 2>/dev/null || true

          if ! grep -q "VERDICT: " /tmp/review.md; then
            echo "Reviewer ran but produced no verdict" >&2
            gh pr comment "$PR" \
              --body "**Strong reviewer returned no verdict** on ${{ github.event.pull_request.head.sha }}. Final message:" || true
            gh pr comment "$PR" --body "$(tail -40 /tmp/review.md 2>/dev/null || echo 'empty')" || true
            exit 1
          fi

          if grep -q "VERDICT: APPROVED" /tmp/review.md; then
            add_label "review-strong:approved"
            remove_label "review-strong:changes" || true
          else
            add_label "review-strong:changes"
            remove_label "review-strong:approved" || true
            gh pr comment "$PR" \
              --body "**Strong reviewer requested changes** on commit ${{ github.event.pull_request.head.sha }}:" || true
            gh pr comment "$PR" --body-file /tmp/review.md || true
          fi

  check:
    name: Lint, Types, Unit tests, Build
    needs: detect
    # Docs-only PRs stop the heavy tier here; every downstream pipeline job
    # skips through the needs-graph, and the merge gate treats "skipped"
    # pipeline as green for that tier.
    if: needs.detect.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run type-check
      - run: bun run test
      - name: Build (with Sentry sourcemaps when token exists)
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun run build
      - run: bun run deps:lint
      - run: bun run knip

  docker:
    name: Docker builds (api, chat)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile -t api:ci .
      - run: docker build -f apps/chat/Dockerfile -t chat:ci .

  deploy-dev:
    name: Deploy to Development
    needs: check
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production – monorepo-chat
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Deploy Convex (Dev)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV || secrets.CONVEX_DEPLOY_KEY }}
        run: |
          cd packages/backend
          bunx convex deploy --cmd 'bun run build'

  e2e:
    name: Playwright (${{ matrix.browser }})
    needs: [check, deploy-dev]
    # Run if check passed. If on develop, wait for deploy-dev.
    if: |
      always() &&
      (needs.check.result == 'success') &&
      (github.ref != 'refs/heads/develop' || needs.deploy-dev.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: bun install --frozen-lockfile
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/e2e
      - name: Run Playwright tests (${{ matrix.browser }})
        env:
          # If develop, we could point to the Dev Vercel URL if we had it.
          # For now, we'll use the localhost webserver but it will hit the Dev Convex backend if configured.
          BASE_URL: http://localhost:3000
        run: bunx playwright test --project=${{ matrix.browser }}
        working-directory: apps/e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/e2e/playwright-report/
          retention-days: 30

  ichiba-e2e:
    name: Ichiba e2e (chromium)
    needs: [check]
    if: |
      always() &&
      (needs.check.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ichiba
          POSTGRES_PASSWORD: ichiba
          POSTGRES_DB: ichiba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ichiba -d ichiba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e
      - name: Migrate + seed catalog
        run: bun run db:migrate && bun run db:seed
        working-directory: apps/ichiba
        env:
          DATABASE_URL: postgresql://ichiba:ichiba@localhost:5432/ichiba
      - name: Check Clerk test keys
        # The ichiba dev server throws on every request without Clerk keys,
        # which surfaces as a 3-minute webServer timeout. Fail fast instead.
        run: |
          if [ -z "${{ secrets.CLERK_PUBLISHABLE_KEY }}" ] || [ -z "${{ secrets.CLERK_SECRET_KEY }}" ]; then
            echo "Ichiba e2e needs CLERK_PUBLISHABLE_KEY + CLERK_SECRET_KEY repo secrets (Clerk test-mode keys from https://dashboard.clerk.com/~/api-keys)."
            exit 1
          fi
      - name: Run ichiba Playwright flow
        env:
          DATABASE_URL: postgresql://ichiba:ichiba@localhost:5432/ichiba
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: bun run test:ichiba
        working-directory: apps/e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-ichiba
          path: apps/e2e/playwright-report/
          retention-days: 30

  deploy-prod:
    name: Deploy to Production
    needs: e2e
    # Run on push to main OR on push to develop after successful E2E (Promotion)
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.e2e.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production – monorepo-chat
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Deploy Convex (Prod)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD || secrets.CONVEX_DEPLOY_KEY }}
        run: |
          cd packages/backend
          bunx convex deploy --cmd 'bun run build'

  merge:
    name: Merge gate
    # Exactly one merge path: this job. It fires when the scheduler can (all
    # needs success or skipped for the PR's tier). Authorizes against live PR
    # state, then squashes. NEVER add this job's check to the required-checks
    # list (scripts/set-branch-protection.sh): it merges from inside itself,
    # so a required self-check would deadlock, and the --auto fallback
    # deliberately relies on this job not being required.
    needs: [detect, triage, review-fast, review-strong, check, docker, e2e, ichiba-e2e]
    if: |
      github.event_name == 'pull_request' &&
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Evaluate merge eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          MERGEABLE: ${{ needs.triage.outputs.mergeable }}
          GH_PROMPT_DISABLED: "1"
          GH_NO_UPDATE_NOTIFIER: "1"
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          base=$(gh pr view "$PR" --repo "$REPO" --json baseRefName -q '.baseRefName')
          case " $AUTO_MERGE_TARGETS " in
            *" $base "*) ;;
            *) echo "Base branch '$base' is not in AUTO_MERGE_TARGETS; human decides. Gate green for non-auto branches."
               exit 0 ;;
          esac

          if [ "$MERGEABLE" != "true" ]; then
            echo "Triage marked this PR needs-human (deny path / over-size diff); a human decides. Gate green."
            exit 0
          fi

          # Skipped pipeline jobs mean the docs-only tier: the pipeline was
          # deliberately not run, which is green for that tier. A pipeline job
          # that RAN and failed makes this job not fire at all (needs graph).
          case "${{ needs.check.result }}${{ needs.docker.result }}${{ needs.e2e.result }}${{ needs.ichiba-e2e.result }}" in
            *failure*|*cancelled*) echo "Unexpected failed upstream (should have been filtered by needs); not merging."; exit 1 ;;
          esac
          echo "Upstream outcomes: check=${{ needs.check.result }} docker=${{ needs.docker.result }} e2e=${{ needs.e2e.result }} ichiba=${{ needs.ichiba-e2e.result }}"

          # Authorization = head unchanged since these reviews ran + live triage
          # and reviewer-approval labels. A push during the checks cancels this
          # run via the concurrency group and the new run re-decides.
          authorized() {
            local labels
            gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid \
              | grep -qx "${{ github.event.pull_request.head.sha }}" \
              || { echo "Head SHA changed since the reviews; verdicts stale."; return 1; }
            labels=$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')
            grep -qx "auto-merge" <<< "$labels" \
              || { echo "Triage no longer authorizes auto-merge."; return 1; }
            grep -qx "review-fast:approved" <<< "$labels" \
              || { echo "Fast reviewer has not approved (anymore)."; return 1; }
            grep -qx "review-strong:approved" <<< "$labels" \
              || { echo "Strong reviewer has not approved (anymore)."; return 1; }
          }

          if ! authorized; then
            echo "Auto-merge not authorized (reason above); Gate green for the human to decide."
            exit 0
          fi

          # timeout guards against gh hanging on an unexpected prompt; 124 =
          # the wrapper's expiry, treated like any direct refusal.
          if ! timeout 120 gh pr merge "$PR" --repo "$REPO" --squash --delete-branch 2>/tmp/merge.err; then
            echo "Direct merge refused; queueing auto-merge instead:" >&2
            cat /tmp/merge.err >&2
            timeout 120 gh pr merge "$PR" --repo "$REPO" --squash --auto --delete-branch
          fi
          echo "Auto-merge complete: triage low-impact, both reviewers approved, pipeline tier green (docs-only PRs skip it by design)."
