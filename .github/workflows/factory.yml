name: Factory

# THE FACTORY: one workflow, one job graph.
#
# PR path:  changes -> triage ----\
#                 \-> full pipeline (lint/build/docker/e2e) -> merge gate
#           PR review happens out-of-band via CodeRabbit (GitHub App), not in
#           this graph. Low-impact PRs squash-merge themselves when everything
#           upstream is green and authorization still holds; everything else
#           ends green with the decision, and a human decides. Red = machinery
#           failure (unreadable state, failed pipeline), never "review said no".
#
# Push path (main/develop): same pipeline jobs + the deploy jobs; triage and
#   merge are PR-only jobs and skip.
#
# Tiering is job-level, not `paths-ignore`: the `detect` job runs
# `scripts/tier-select.ts` (from a trusted ref, never the PR head) and
# outputs `docs_only` plus the affected-tier selectors
# (`docker_needed`, `chat_e2e_needed`, `ichiba_e2e_needed`); `check`
# conditionally skips, and every pipeline job that needs it (or matches a
# selector) skips with it — natively, through the job graph.
#
# Why the old Gate's poll loop is gone: the merge job uses `needs:` edges as
# the wait. GitHub fires it the instant upstream jobs conclude — no polling
# cadence, no wall-clock deadline, and a stuck foreign check (Vercel) can no
# longer stall the gate, because only THIS workflow's jobs are in the wait
# set. Foreign preview deployments are advisory and never block a merge.
#
# Setup: docs/PR-GATE.md. One-time: `bash scripts/set-branch-protection.sh`.

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  # Workflow token scope is REPLACED by this block, not unioned: only what
  # the jobs below use. No checks/actions reads — the needs-graph replaces
  # the old cross-workflow status reads.
  contents: write      # merge gate squash-merges and deletes merged branches
  issues: write        # labels are issue resources (triage stamps)
  pull-requests: write # diffs, comments, merge

concurrency:
  # Cancel superseded PR runs; never cancel main/develop deploys.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.4.3"
  # Branches the merge gate may auto-merge into. Remove "main" to keep prod
  # merges human.
  AUTO_MERGE_TARGETS: "develop main"
  # Diff size under which the gate may auto-merge (additions + deletions).
  MAX_DIFF_LINES: "400"

jobs:
  detect:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      docker_needed: ${{ steps.detect.outputs.docker_needed }}
      chat_e2e_needed: ${{ steps.detect.outputs.chat_e2e_needed }}
      ichiba_e2e_needed: ${{ steps.detect.outputs.ichiba_e2e_needed }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Detect tier
        env:
          GH_TOKEN: ${{ github.token }}
        id: detect
        run: |
          REPO="${{ github.repository }}"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Pushes (develop/main) always run the full graph.
            for out in docs_only docker_needed chat_e2e_needed ichiba_e2e_needed; do
              echo "$out=false" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          # scripts/tier-select.ts is the single source of truth for tier
          # selection; behavior-tested in scripts/factory.test.ts. It runs
          # from a TRUSTED ref, never from the PR head: scripts/** is not a
          # triage deny path, so a PR could otherwise edit its own selectors
          # to skip its own gates (self-selection hole).
          data=$(gh pr view "${{ github.event.pull_request.number }}" --repo "$REPO" --json files)
          # Explicit destination refspecs: actions/checkout on pull_request
          # leaves single-branch fetch config, so a bare "git fetch origin
          # main develop" would only update FETCH_HEAD and refs/remotes/
          # origin/main would never exist. Fetch each trusted ref into its
          # remote-tracking slot and log what landed (CI-verifiable).
          git fetch --no-tags --depth 1 origin +main:refs/remotes/origin/main > /dev/null 2>&1 || true
          git fetch --no-tags --depth 1 origin +develop:refs/remotes/origin/develop > /dev/null 2>&1 || true
          for r in main develop; do
            if git show-ref --verify -q refs/remotes/origin/"$r"; then
              echo "fetched origin/$r @ $(git rev-parse --short origin/"$r")"
            else
              echo "origin/$r: not fetched"
            fi
          done
          # Execute OUTSIDE the PR checkout, from a fresh dir with an
          # isolated HOME: Bun auto-loads bunfig.toml from the cwd and
          # ~/.bunfig.toml otherwise, and a PR-supplied bunfig preload
          # would run arbitrary code inside detect (which holds GH_TOKEN
          # and $GITHUB_OUTPUT). The copied module has no relative imports,
          # so nothing else resolves from the checkout either.
          stepdir=$(mktemp -d "${RUNNER_TEMP:-/tmp}/tiersel.XXXXXX")
          sel="$stepdir/tier-select.ts"
          src=""
          if git show origin/main:scripts/tier-select.ts > "$sel" 2>/dev/null; then
            src="origin/main"
          elif git show origin/develop:scripts/tier-select.ts > "$sel" 2>/dev/null; then
            src="origin/develop"
          else
            # Bootstrap window (module not yet on any squash-merged ref):
            # fail toward MORE validation - run the full graph - rather
            # than trust the PR's own copy.
            echo "WARNING: tier-select.ts not on main/develop; running the FULL graph."
          fi
          if [ -n "$src" ]; then
            echo "Tier selector source: $src (trusted ref)"
            tiers=$(printf '%s' "$data" | (cd "$stepdir" && HOME="$stepdir" bun "$sel"))
          else
            tiers='{"docs_only":false,"docker_needed":true,"chat_e2e_needed":true,"ichiba_e2e_needed":true}'
          fi
          echo "Tiers: $tiers"
          for out in docs_only docker_needed chat_e2e_needed ichiba_e2e_needed; do
            echo "$out=$(jq -r ".$out" <<< "$tiers")" >> "$GITHUB_OUTPUT"
          done

  triage:
    name: Triage impact
    needs: detect
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mergeable: ${{ steps.triage.outputs.mergeable }}
    steps:
      - name: Classify PR
        env:
          GH_TOKEN: ${{ github.token }}
        id: triage
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          add_label()    { gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$1" > /dev/null; }
          create_label() { gh api -X POST "repos/$REPO/labels" -f name="$1" -f color="$2" -f description="$3" > /dev/null 2>&1 || true; }
          remove_label() { gh api -X DELETE "repos/$REPO/issues/$PR/labels/${1//:/%3A}" > /dev/null 2>&1 || true; }

          create_label "auto-merge" "0e8a16" "Triage: low impact, auto-merge candidate"
          create_label "needs-human" "dedede" "Triage: human review required"

          data=$(gh pr view "$PR" --repo "$REPO" --json files,additions,deletions)
          lines=$(($(echo "$data" | jq -r '.additions') + $(echo "$data" | jq -r '.deletions')))

          mergeable=true
          deny_regex='^(packages/backend/|\.github/|infra/|docker-compose\.yml$|\.env)'
          # Dependency manifests/lockfiles under packages/backend are version
          # bumps only — they cannot reach the Convex schema, so the backend
          # deny path exempts them.
          deny_exception_regex='^packages/backend/(package\.json|bun\.lock|uv\.lock)$'
          for path in $(echo "$data" | jq -r '.files[].path'); do
            if echo "$path" | grep -qE "$deny_regex" \
              && ! echo "$path" | grep -qE "$deny_exception_regex"; then
              echo "Deny path touched: $path"
              mergeable=false
            fi
          done

          # Bigger diffs are only low-impact if they are entirely docs/config/deps.
          if [ "$lines" -gt "${{ env.MAX_DIFF_LINES }}" ]; then
            # `(^|.*/)` so workspace manifests (apps/*/package.json) count as
            # dep-only files, not just the root one.
            docs_regex='^(docs/|README|\.env\.example|(.*/)?package\.json$|(.*/)?bun\.lock$|(.*/)?uv\.lock$)'
            for path in $(echo "$data" | jq -r '.files[].path'); do
              if ! echo "$path" | grep -qE "$docs_regex"; then
                echo "Large diff (${lines} lines) touches non-docs file: $path"
                mergeable=false
              fi
            done
          fi

          if [ "$mergeable" = "true" ]; then
            add_label "auto-merge"
            remove_label "needs-human" || true
          else
            add_label "needs-human"
            remove_label "auto-merge" || true
          fi

          echo "mergeable=$mergeable" >> "$GITHUB_OUTPUT"
          echo "Triage verdict: $mergeable (${lines} changed lines)"

  check:
    name: Lint, Types, Unit tests, Build
    needs: detect
    # Docs-only PRs stop the heavy tier here; every downstream pipeline job
    # skips through the needs-graph, and the merge gate treats "skipped"
    # pipeline as green for that tier.
    if: needs.detect.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-turbo-
      - name: Turbo remote cache (optional)
        # Set the TURBO_TOKEN secret (Vercel) to share the cache between
        # local runs, CI, and agent machines; falls back to the local cache
        # above when unset.
        env:
          _TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          _TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: |
          if [ -z "$_TURBO_TOKEN" ] || [ -z "$_TURBO_TEAM" ]; then
            echo "TURBO_TOKEN/TURBO_TEAM not fully configured; turbo uses the local cache only."
          else
            echo "TURBO_TOKEN=$_TURBO_TOKEN" >> "$GITHUB_ENV"
            echo "TURBO_TEAM=$_TURBO_TEAM" >> "$GITHUB_ENV"
          fi
      - run: bun install --frozen-lockfile
      # apps/ichiba-go: Go workspace (go modules). Without DATABASE_URL its
      # DB-backed tests self-skip; pure parity tests always run.
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/ichiba-go/go.mod
          cache-dependency-path: apps/ichiba-go/go.sum
      # apps/ichiba-py: Python workspace (uv-governed). Without DATABASE_URL
      # its DB-backed tests self-skip; pure parity tests always run.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/ichiba-py/uv.lock
      - run: uv sync --frozen
        working-directory: apps/ichiba-py
      - run: bun run lint
      - run: bun run type-check
      - run: bun run test
      - name: Build (with Sentry sourcemaps when token exists)
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun run build
      - run: bun run deps:lint
      - run: bun run knip

  docker:
    name: Docker builds (api, chat, ichiba-go)
    needs: [detect, check]
    # PRs: only when api/chat/ichiba-go surfaces or shared config changed;
    # pushes always validate the containers before deploy.
    if: github.event_name == 'push' || needs.detect.outputs.docker_needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/api/Dockerfile -t api:ci .
      - run: docker build -f apps/chat/Dockerfile -t chat:ci .
      - run: docker build -f apps/ichiba-go/Dockerfile -t ichiba-go:ci .

  deploy-dev:
    name: Deploy to Development
    needs: check
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production – monorepo-chat
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Deploy Convex (Dev)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV || secrets.CONVEX_DEPLOY_KEY }}
        run: |
          cd packages/backend
          bunx convex deploy --cmd 'bun run build'

  e2e:
    name: Playwright (${{ matrix.browser }})
    needs: [detect, check, deploy-dev]
    # Run if check passed. If on develop, wait for deploy-dev. On PRs, only
    # when the chat/kanji surfaces (or shared config) are in the diff.
    if: |
      always() &&
      (needs.check.result == 'success') &&
      (github.ref != 'refs/heads/develop' || needs.deploy-dev.result == 'success') &&
      (github.event_name == 'push' || needs.detect.outputs.chat_e2e_needed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: bun install --frozen-lockfile
      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/e2e
      - name: Run Playwright tests (${{ matrix.browser }})
        env:
          # If develop, we could point to the Dev Vercel URL if we had it.
          # For now, we'll use the localhost webserver but it will hit the Dev Convex backend if configured.
          BASE_URL: http://localhost:3000
        run: bunx playwright test --project=${{ matrix.browser }}
        working-directory: apps/e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/e2e/playwright-report/
          retention-days: 30

  ichiba-e2e:
    name: Ichiba e2e (chromium)
    needs: [detect, check]
    # On PRs, only when the ichiba surface (or shared config) is in the diff.
    if: |
      always() &&
      (needs.check.result == 'success') &&
      (github.event_name == 'push' || needs.detect.outputs.ichiba_e2e_needed == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ichiba
          POSTGRES_PASSWORD: ichiba
          POSTGRES_DB: ichiba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ichiba -d ichiba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/ichiba-go/go.mod
          cache-dependency-path: apps/ichiba-go/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/ichiba-py/uv.lock
      - run: uv sync --frozen
        working-directory: apps/ichiba-py
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/e2e
      - name: Migrate + seed catalog
        run: bun run db:migrate && bun run db:seed
        working-directory: apps/ichiba
        env:
          DATABASE_URL: postgresql://ichiba:ichiba@localhost:5432/ichiba
      - name: Python backend contract tests (same Postgres)
        run: uv run pytest
        working-directory: apps/ichiba-py
        env:
          DATABASE_URL: postgresql://ichiba:ichiba@localhost:5432/ichiba
      - name: Go backend contract tests (same Postgres)
        # Full contract against the shared service: build the binary, run
        # it against the same Postgres the e2e flow uses, and hit it with
        # the shared stdlib contract checker (ichiba-go serves the FULL
        # contract — reads + checkout/orders — since the phase-2 port).
        # -C because the repo root is not a Go module; the workspace's
        # go.mod is the unit.
        run: |
          go build -C apps/ichiba-go -o /tmp/ichiba-go .
          DATABASE_URL=postgresql://ichiba:ichiba@localhost:5432/ichiba PORT=3022 /tmp/ichiba-go &
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3022/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:3022/api/health > /dev/null
          python3 scripts/contract.py http://localhost:3022
      - name: Differential fuzz — Go vs Python twins (same Postgres)
        # The strongest drift detector: both twins serve the SAME seeded
        # matrix of query shapes (metacharacters, sort/page/perPage edges,
        # unknown sorts, huge pages, seeded combos) against the same
        # database, and must agree on status + JSON body for every case.
        # The Go server above is still running; add the Django twin and
        # diff them (scripts/diff-twins.py, pure stdlib, seeded → stable).
        run: |
          DATABASE_URL=postgresql://ichiba:ichiba@localhost:5432/ichiba \
            uv run python manage.py runserver 0.0.0.0:3021 --noreload &
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3021/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:3021/api/health > /dev/null
          python3 ../../scripts/diff-twins.py http://localhost:3022 http://localhost:3021
        working-directory: apps/ichiba-py
      - name: Check Clerk test keys
        # The ichiba dev server throws on every request without Clerk keys,
        # which surfaces as a 3-minute webServer timeout. Fail fast instead.
        run: |
          if [ -z "${{ secrets.CLERK_PUBLISHABLE_KEY }}" ] || [ -z "${{ secrets.CLERK_SECRET_KEY }}" ]; then
            echo "Ichiba e2e needs CLERK_PUBLISHABLE_KEY + CLERK_SECRET_KEY repo secrets (Clerk test-mode keys from https://dashboard.clerk.com/~/api-keys)."
            exit 1
          fi
      - name: Run ichiba Playwright flow
        env:
          DATABASE_URL: postgresql://ichiba:ichiba@localhost:5432/ichiba
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: bun run test:ichiba
        working-directory: apps/e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-ichiba
          path: apps/e2e/playwright-report/
          retention-days: 30

  deploy-prod:
    name: Deploy to Production
    needs: e2e
    # Run on push to main OR on push to develop after successful E2E (Promotion)
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.e2e.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: Production – monorepo-chat
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Deploy Convex (Prod)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD || secrets.CONVEX_DEPLOY_KEY }}
        run: |
          cd packages/backend
          bunx convex deploy --cmd 'bun run build'

  merge:
    name: Merge gate
    # Exactly one merge path: this job. It fires when the scheduler can (all
    # needs success or skipped for the PR's tier). Authorizes against live PR
    # state, then squashes. NEVER add this job's check to the required-checks
    # list (scripts/set-branch-protection.sh): it merges from inside itself,
    # so a required self-check would deadlock, and the --auto fallback
    # deliberately relies on this job not being required.
    needs: [detect, triage, check, docker, e2e, ichiba-e2e]
    if: |
      github.event_name == 'pull_request' &&
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Evaluate merge eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          MERGEABLE: ${{ needs.triage.outputs.mergeable }}
          GH_PROMPT_DISABLED: "1"
          GH_NO_UPDATE_NOTIFIER: "1"
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          base=$(gh pr view "$PR" --repo "$REPO" --json baseRefName -q '.baseRefName')
          case " $AUTO_MERGE_TARGETS " in
            *" $base "*) ;;
            *) echo "Base branch '$base' is not in AUTO_MERGE_TARGETS; human decides. Gate green for non-auto branches."
               exit 0 ;;
          esac

          if [ "$MERGEABLE" != "true" ]; then
            echo "Triage marked this PR needs-human (deny path / over-size diff); a human decides. Gate green."
            exit 0
          fi

          # Skipped pipeline jobs mean the docs-only tier: the pipeline was
          # deliberately not run, which is green for that tier. A pipeline job
          # that RAN and failed makes this job not fire at all (needs graph).
          case "${{ needs.check.result }}${{ needs.docker.result }}${{ needs.e2e.result }}${{ needs.ichiba-e2e.result }}" in
            *failure*|*cancelled*) echo "Unexpected failed upstream (should have been filtered by needs); not merging."; exit 1 ;;
          esac
          echo "Upstream outcomes: check=${{ needs.check.result }} docker=${{ needs.docker.result }} e2e=${{ needs.e2e.result }} ichiba=${{ needs.ichiba-e2e.result }}"

          # Authorization = head unchanged since triage ran + live triage label.
          # PR review itself happens out-of-band (CodeRabbit); a push during
          # the checks cancels this run via the concurrency group and the new
          # run re-decides.
          authorized() {
            local labels
            gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid \
              | grep -qx "${{ github.event.pull_request.head.sha }}" \
              || { echo "Head SHA changed since triage; verdict stale."; return 1; }
            labels=$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')
            grep -qx "auto-merge" <<< "$labels" \
              || { echo "Triage no longer authorizes auto-merge."; return 1; }
          }

          if ! authorized; then
            echo "Auto-merge not authorized (reason above); Gate green for the human to decide."
            exit 0
          fi

          # timeout guards against gh hanging on an unexpected prompt; 124 =
          # the wrapper's expiry, treated like any direct refusal.
          if ! timeout 120 gh pr merge "$PR" --repo "$REPO" --squash --delete-branch 2>/tmp/merge.err; then
            echo "Direct merge refused; queueing auto-merge instead:" >&2
            cat /tmp/merge.err >&2
            timeout 120 gh pr merge "$PR" --repo "$REPO" --squash --auto --delete-branch
          fi
          echo "Auto-merge complete: triage low-impact, pipeline tier green (docs-only PRs skip it by design)."
