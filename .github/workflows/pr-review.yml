name: PR Gate

# REVIEW AGENTS + AUTO-MERGE GATE
#
# Every PR gets two fresh OpenCode sessions (fast + strong model, both from the
# free `opencode` provider by default) plus a deterministic triage step. If
# triage rates the PR low-impact and both agents approve, the Gate waits for the
# full pipeline and squash-merges (queueing instead where branch protection
# blocks a mid-run merge). Everything else ends green with the decision; a
# human decides. Red means the Gate machinery itself failed.
#
# Setup: docs/PR-GATE.md. One-time: `bash scripts/set-branch-protection.sh`.

on:
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: write # Gate squash-merges (the merge endpoint writes a commit) and
                  # deletes merged branches; agents themselves never touch git.
  checks: read # Gate reads statusCheckRollup (CheckRuns) — declaring any
               # permissions block replaces the default token scope, so the
               # check-run read must be granted explicitly.
  actions: read # gh's GraphQL rollup expansion also fetches the workflow runs
                # behind check suites (checkSuite.workflowRun).
  issues: write # labels are issue resources: gh label create / add / remove
  pull-requests: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Swap reviewer models via repo variables without touching this file.
  FAST_MODEL: ${{ vars.REVIEW_FAST_MODEL || 'opencode/glm-5.3-flash-free' }}
  STRONG_MODEL: ${{ vars.REVIEW_STRONG_MODEL || 'opencode/minimax-m3.1-flash-free#high' }}
  # Branches the gate may auto-merge into. Remove "main" to keep prod merges human.
  AUTO_MERGE_TARGETS: "develop main"
  # Diff size under which the gate may auto-merge (additions + deletions).
  MAX_DIFF_LINES: "400"

jobs:
  triage:
    name: Triage impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mergeable: ${{ steps.triage.outputs.mergeable }}
    steps:
      - name: Classify PR
        env:
          GH_TOKEN: ${{ github.token }}
        id: triage
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          add_label()    { gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$1" > /dev/null; }
          create_label() { gh api -X POST "repos/$REPO/labels" -f name="$1" -f color="$2" -f description="$3" > /dev/null 2>&1 || true; }
          remove_label() { gh api -X DELETE "repos/$REPO/issues/$PR/labels/${1//:/%3A}" > /dev/null 2>&1 || true; }

          # Idempotent creates via REST across gh versions (issues-label adds
          # auto-create missing labels too; this is the belt to its suspenders).
          create_label "auto-merge" "0e8a16" "Triage: low impact, agent-approved"
          create_label "needs-human" "dedede" "Triage: human review required"
          create_label "review-fast:approved" "0e8a16" "Fast reviewer approved"
          create_label "review-fast:changes" "d93f0b" "Fast reviewer requested changes"
          create_label "review-strong:approved" "0e8a16" "Strong reviewer approved"
          create_label "review-strong:changes" "d93f0b" "Strong reviewer requested changes"

          data=$(gh pr view "$PR" --repo "$REPO" --json files,additions,deletions)
          lines=$(($(echo "$data" | jq -r '.additions') + $(echo "$data" | jq -r '.deletions')))

          mergeable=true
          deny_regex='^(packages/backend/|\.github/|infra/|docker-compose\.yml$|\.env)'
          for path in $(echo "$data" | jq -r '.files[].path'); do
            if echo "$path" | grep -qE "$deny_regex"; then
              echo "Deny path touched: $path"
              mergeable=false
            fi
          done

          # Bigger diffs are only low-impact if they are entirely docs/config/deps.
          if [ "$lines" -gt "${{ env.MAX_DIFF_LINES }}" ]; then
            docs_regex='^(docs/|README|\.env\.example|package\.json$|bun\.lock$)'
            for path in $(echo "$data" | jq -r '.files[].path'); do
              if ! echo "$path" | grep -qE "$docs_regex"; then
                echo "Large diff (${lines} lines) touches non-docs file: $path"
                mergeable=false
              fi
            done
          fi

          if [ "$mergeable" = "true" ]; then
            add_label "auto-merge"
            remove_label "needs-human" || true
          else
            add_label "needs-human"
            remove_label "auto-merge" || true
          fi

          echo "mergeable=$mergeable" >> "$GITHUB_OUTPUT"
          echo "Triage verdict: $mergeable (${lines} changed lines)"

  review-fast:
    name: Review - fast sweep
    needs: triage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" > /tmp/pr.diff
          gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --json title,body \
            --jq '"# PR title\n\n" + .title + "\n\n# PR description\n\n" + (.body // "none provided")' \
            > /tmp/pr.intent
      - name: Install opencode
        # npm `opencode-ai@latest` is still V1, which rejects V2 config.
        # V2 comes from the official installer. GITHUB_PATH only takes effect
        # in the NEXT step, so assert via the explicit binary path here.
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version
      - name: Run fast reviewer
        env:
          # Default models on the `opencode` free provider need no credential.
          # Set the secret only if a reviewer model requires auth.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          # gh's `gh pr label` subcommand is absent on some runner images; use the
          # issues REST API directly. Labels named like "review-fast:changes".
          add_label()    { gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$1" > /dev/null; }
          remove_label() { gh api -X DELETE "repos/$REPO/issues/$PR/labels/${1//:/%3A}" > /dev/null 2>&1 || true; }

          remove_label "review-fast:approved"
          remove_label "review-fast:changes"

          # An empty OPENCODE_API_KEY (secret unset) can be treated as an
          # invalid token by providers; only expose it when configured.
          if [ -z "$OPENCODE_API_KEY" ]; then unset OPENCODE_API_KEY; fi

          set +e
          opencode run --format json --agent review-fast -m "$FAST_MODEL" \
            --title "pr-$PR-review-fast" \
            --file /tmp/pr.diff \
            --file /tmp/pr.intent \
            "You are reviewing a pull request in a monorepo. The first attached file is the full diff; the second contains the PR title and description. Follow your agent instructions exactly." \
            > /tmp/review.jsonl 2>/tmp/review.err
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "opencode run failed (rc=$rc); last stderr lines:" >&2
            tail -15 /tmp/review.err >&2 || true
            gh pr comment "$PR" \
              --body "**Fast reviewer crashed** (rc=$rc) on ${{ github.event.pull_request.head.sha }}:" || true
            gh pr comment "$PR" --body "$(tail -20 /tmp/review.err 2>/dev/null || echo 'no stderr')" || true
            exit 1
          fi

          jq -r 'select(.type=="text") | (.part.text // .text // empty)' /tmp/review.jsonl > /tmp/review.md 2>/dev/null || true

          if ! grep -q "VERDICT: " /tmp/review.md; then
            echo "Reviewer ran but produced no verdict" >&2
            gh pr comment "$PR" \
              --body "**Fast reviewer returned no verdict** on ${{ github.event.pull_request.head.sha }}. Final message:" || true
            gh pr comment "$PR" --body "$(tail -40 /tmp/review.md 2>/dev/null || echo 'empty')" || true
            exit 1
          fi

          if grep -q "VERDICT: APPROVED" /tmp/review.md; then
            add_label "review-fast:approved"
            remove_label "review-fast:changes" || true
          else
            add_label "review-fast:changes"
            remove_label "review-fast:approved" || true
            gh pr comment "$PR" \
              --body "**Fast reviewer requested changes** on commit ${{ github.event.pull_request.head.sha }}:" || true
            gh pr comment "$PR" --body-file /tmp/review.md || true
          fi

  review-strong:
    name: Review - intent (strong)
    needs: triage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" > /tmp/pr.diff
          gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --json title,body \
            --jq '"# PR title\n\n" + .title + "\n\n# PR description\n\n" + (.body // "none provided")' \
            > /tmp/pr.intent
      - name: Install opencode
        # npm `opencode-ai@latest` is still V1, which rejects V2 config.
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --no-modify-path
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version
      - name: Run strong reviewer
        env:
          # Default models on the `opencode` free provider need no credential.
          # Set the secret only if a reviewer model requires auth.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          add_label()    { gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=$1" > /dev/null; }
          remove_label() { gh api -X DELETE "repos/$REPO/issues/$PR/labels/${1//:/%3A}" > /dev/null 2>&1 || true; }

          remove_label "review-strong:approved"
          remove_label "review-strong:changes"

          # An empty OPENCODE_API_KEY (secret unset) can be treated as an
          # invalid token by providers; only expose it when configured.
          if [ -z "$OPENCODE_API_KEY" ]; then unset OPENCODE_API_KEY; fi

          set +e
          opencode run --format json --agent review-strong -m "$STRONG_MODEL" \
            --title "pr-$PR-review-strong" \
            --file /tmp/pr.diff \
            --file /tmp/pr.intent \
            "You are reviewing a pull request in a monorepo. The first attached file is the full diff; the second contains the PR title and description, which is the stated intent. Follow your agent instructions exactly." \
            > /tmp/review.jsonl 2>/tmp/review.err
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "opencode run failed (rc=$rc); last stderr lines:" >&2
            tail -15 /tmp/review.err >&2 || true
            gh pr comment "$PR" \
              --body "**Strong reviewer crashed** (rc=$rc) on ${{ github.event.pull_request.head.sha }}:" || true
            gh pr comment "$PR" --body "$(tail -20 /tmp/review.err 2>/dev/null || echo 'no stderr')" || true
            exit 1
          fi

          jq -r 'select(.type=="text") | (.part.text // .text // empty)' /tmp/review.jsonl > /tmp/review.md 2>/dev/null || true

          if ! grep -q "VERDICT: " /tmp/review.md; then
            echo "Reviewer ran but produced no verdict" >&2
            gh pr comment "$PR" \
              --body "**Strong reviewer returned no verdict** on ${{ github.event.pull_request.head.sha }}. Final message:" || true
            gh pr comment "$PR" --body "$(tail -40 /tmp/review.md 2>/dev/null || echo 'empty')" || true
            exit 1
          fi

          if grep -q "VERDICT: APPROVED" /tmp/review.md; then
            add_label "review-strong:approved"
            remove_label "review-strong:changes" || true
          else
            add_label "review-strong:changes"
            remove_label "review-strong:approved" || true
            gh pr comment "$PR" \
              --body "**Strong reviewer requested changes** on commit ${{ github.event.pull_request.head.sha }}:" || true
            gh pr comment "$PR" --body-file /tmp/review.md || true
          fi

  gate:
    name: Gate
    needs: [triage, review-fast, review-strong]
    runs-on: ubuntu-24.04
    # Must outlive the slowest check in this repo (currently the e2e suite).
    timeout-minutes: 35
    # Everything that is *not* machinery failure ends green: merged, or declined
    # with the reason. Red = the gate itself crashed. This also keeps the Gate
    # compatible with branch protection: a pending self-check can never pass a
    # mid-run direct merge, so the required-check list (see
    # scripts/set-branch-protection.sh) deliberately excludes Gate, and the
    # merge falls back to an `--auto` queue when GitHub refuses directly.
    steps:
      - name: Evaluate merge eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          MERGEABLE: ${{ needs.triage.outputs.mergeable }}
          GH_PROMPT_DISABLED: "1"
          GH_NO_UPDATE_NOTIFIER: "1"
        run: |
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          base=$(gh pr view "$PR" --repo "$REPO" --json baseRefName -q '.baseRefName')
          case " $AUTO_MERGE_TARGETS " in
            *" $base "*) ;;
            *) echo "Base branch '$base' is not in AUTO_MERGE_TARGETS; human decides. Gate green for non-auto branches."
               exit 0 ;;
          esac

          if [ "$MERGEABLE" != "true" ]; then
            echo "Triage marked this PR needs-human (deny path / over-size diff); a human decides. Gate green."
            exit 0
          fi

          # Authorization = head unchanged since these reviews ran + live triage
          # and reviewer-approval labels. Checked up front and re-checked right
          # before merging: a push during the wait restarts reviews, and the new
          # reviewer runs strip the approval labels first thing.
          authorized() {
            local labels
            gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid \
              | grep -qx "${{ github.event.pull_request.head.sha }}" \
              || { echo "Head SHA changed since the reviews; verdicts stale."; return 1; }
            labels=$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')
            grep -qx "auto-merge" <<< "$labels" \
              || { echo "Triage no longer authorizes auto-merge."; return 1; }
            grep -qx "review-fast:approved" <<< "$labels" \
              || { echo "Fast reviewer has not approved (anymore)."; return 1; }
            grep -qx "review-strong:approved" <<< "$labels" \
              || { echo "Strong reviewer has not approved (anymore)."; return 1; }
          }

          if ! authorized; then
            echo "Auto-merge not authorized (reason above); Gate green for the human to decide."
            exit 0
          fi

          # Wait for all OTHER checks (pipeline, e2e, ...) to finish, then
          # verify none failed. Polled via REST, NOT the statusCheckRollup
          # GraphQL: the integration token cannot read other apps' checks
          # (Vercel etc.), and that read errors the whole GraphQL query. The
          # REST list simply omits what the token cannot see, so our repo's
          # own pipeline checks are the mandatory wait set. The deadline must
          # land inside this job's timeout-minutes: 33 min of polling + startup
          # < 35 min, so the timeout branch below is reachable. gh -q takes a
          # single expression (no --arg): constants are inlined.
          # Wall-clock deadline via $SECONDS: the old counter subtracted only
          # sleep time, ignoring each cycle's api/jq overhead, so a "33 min"
          # budget actually spanned ~45 real minutes and the runner's
          # timeout-minutes killed the job before the graceful branch fired.
          start=$SECONDS
          while true; do
            head_sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid) \
              || { echo "Failed to read PR head; not merging"; exit 1; }

            # Check runs: an unreadable read is a machinery failure (red).
            if ! gh api "repos/$REPO/commits/$head_sha/check-runs?per_page=100" > /tmp/checks.json 2>/tmp/checks.err; then
              echo "Check-run read failed; not merging:" >&2
              tail -3 /tmp/checks.err >&2
              exit 1
            fi
            # Legacy commit statuses: readable normally, but tolerate a 403
            # loudly (best-effort context, not the wait set).
            status_json=$(gh api "repos/$REPO/commits/$head_sha/status" 2>/tmp/statuses.err) || {
              echo "Legacy commit-status read failed; relying on check runs:" >&2
              tail -3 /tmp/statuses.err >&2
              status_json='{}'
            }
            echo "$status_json" > /tmp/statuses.json

            checks_pending=$(jq '[(.check_runs // [])[] | select(.name != "Gate") | select(.status != "COMPLETED")] | length' /tmp/checks.json)
            statuses_pending=$(jq '[(.statuses // [])[] | select(.state == "PENDING")] | length' /tmp/statuses.json)
            [ "$((checks_pending + statuses_pending))" -eq 0 ] && break

            if [ $((SECONDS - start)) -ge 1920 ]; then
              echo "Timed out waiting (32 min) for other checks; not merging. Gate green (no merge performed)."
              echo "Still pending:" >&2
              jq -r '[(.check_runs // [])[] | select(.name != "Gate") | select(.status != "COMPLETED") | .name] | join(", ")' /tmp/checks.json >&2
              jq -r '[(.statuses // [])[] | select(.state == "PENDING") | .context] | join(", ")' /tmp/statuses.json >&2
              exit 0
            fi
            echo "waiting on: $(jq -r '[(.check_runs // [])[] | select(.name != "Gate") | select(.status != "COMPLETED") | .name] | join(", ")' /tmp/checks.json) / $(jq -r '[(.statuses // [])[] | select(.state == "PENDING") | .context] | join(", ")' /tmp/statuses.json)"
            sleep 20
          done

          failed=$(jq -r '[(.check_runs // [])[] | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "TIMED_OUT" or .conclusion == "STARTUP_FAILURE" or .conclusion == "ACTION_REQUIRED") | .name] | join(", ")' /tmp/checks.json)
          failed="$failed $(jq -r '[(.statuses // [])[] | select(.state == "FAILURE" or .state == "ERROR") | .context] | join(", ")' /tmp/statuses.json)"
          if [ -n "${failed// /}" ]; then
            echo "Pipeline checks failed; a human decides. Gate green (no merge performed):"
            echo "$failed"
            exit 0
          fi

          # Final re-check: the merge must carry approvals stamped for exactly
          # this head and still attached.
          if ! authorized; then
            echo "Authorization expired while checks ran (new push or new verdicts); the fresh run re-decides. Gate green."
            exit 0
          fi

          # timeout guards against gh hanging on an unexpected prompt; 124 =
          # the wrapper's expiry, treated like any direct refusal.
          if ! timeout 120 gh pr merge "$PR" --repo "$REPO" --squash --delete-branch 2>/tmp/merge.err; then
            echo "Direct merge refused; queueing auto-merge instead:" >&2
            cat /tmp/merge.err >&2
            timeout 120 gh pr merge "$PR" --repo "$REPO" --squash --auto --delete-branch
          fi
          echo "Auto-merge complete: triage low-impact, both reviewers approved, full pipeline green."
