name: Dependency updates

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/ichiba-py/uv.lock
      - run: uv sync --frozen
        working-directory: apps/ichiba-py
      - name: Check for updates
        run: bun run update:check
      - name: Apply updates
        run: bun run update
      - name: Verify
        id: verify
        continue-on-error: true
        run: bun run check
      - name: Create PR
        if: always()
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: weekly dependency updates"
          title: "chore: weekly dependency updates"
          body: |
            Automated `bun run update` + `bun run check`.

            - Verify: ${{ steps.verify.outcome }}
            - Review `bun.lock` diff before merging.
            - If verify failed, check logs for `tsup`/`eslint` incompatibilities (e.g. TS7 + tsup DTS).
          branch: chore/dependency-updates
          delete-branch: true
