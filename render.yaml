# Render Blueprint: prod hosting for the ichiba backend twins
# (docs/BACKEND_TWINS.md). Two Docker web services built from this repo's
# existing Dockerfiles — the same images docker-compose builds locally.
#
# Both bind to $PORT at runtime (Render injects it; the Go binary reads it,
# the python image's CMD defaults to 3021 when unset), so no port config
# lives here. Both read DATABASE_URL / POSTGRES_URL — set it once per
# service in the dashboard (sync: false) to the SAME prod Neon URL the
# ichiba Vercel project uses: every backend reads one Postgres.
#
# plan: free (the workspace's free tier: 750 shared instance hrs/mo,
# 512 MB / 0.1 CPU, instances sleep after ~15 min idle). A sleeping twin
# silently loses the flag race to the 3s RSC fallback — the page still
# renders, but always on the canonical TS path until the twin is warm
# (~30-60s wake). Two always-on twins need ~1,460 hrs/mo, so free cannot
# sustain both continuously; flip plan to "starter" before pointing real
# traffic at the flags.
#
# region should match your Neon project's region for latency.

# region: Render's Virginia (Ashburn) — matches the Neon prod project
# ichiba-east, AWS US East 1 (N. Virginia).

services:
  - type: web
    name: ichiba-py
    runtime: docker
    dockerfilePath: apps/ichiba-py/Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    plan: free
    region: virginia
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        # Render's HTTP health probes send Host: <service>.onrender.com;
        # without this Django answers 400 before the view runs and the
        # deploy times out ("Timed Out" despite gunicorn listening).
        # The leading dot matches any *.onrender.com (survives renames);
        # localhost keeps Render's port-detector HEAD probes quiet.
        value: ".onrender.com,localhost,127.0.0.1"

  - type: web
    name: ichiba-go
    runtime: docker
    dockerfilePath: apps/ichiba-go/Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    plan: free
    region: virginia
    envVars:
      - key: DATABASE_URL
        sync: false
