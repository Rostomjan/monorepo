[project]
name = "ichiba-py"
version = "0.0.0"
description = "Ichiba backend, Python edition — Django + DRF mirror of apps/ichiba's TS API surface (see docs/DUAL_BACKEND.md)"
requires-python = ">=3.12"

dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "gunicorn>=23.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.9",
    "mypy>=1.14",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["config", "ichibaapi"]

[tool.mypy]
python_version = "3.12"
# django-stubs' strict mode fights DRF's dynamic API; start moderate and
# tighten file-by-file as the parity port stabilizes.
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
# Any test that needs a real database carries this marker (see
# tests/conftest.py) and skips itself when DATABASE_URL/POSTGRES_URL is
# unset — so `bun run check` stays green in CI with no Postgres service.
