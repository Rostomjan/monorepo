# Scale-lab gateway: load balancer + API-gateway lite in front of ichiba1/2.
# Learn the split:
#   LB role      -> upstream + least_conn + health-aware proxying
#   Gateway role -> rate limit, /api/* routing rules, cache headers, request logging

events {}

http {
  log_format gated '$remote_addr - $request_id "$request" $status '
                   'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

  access_log /var/log/nginx/access.log gated;

  # Gateway: 100 req/min per IP for writes, looser for reads.
  limit_req_zone $binary_remote_addr zone=read_zone:10m rate=100r/s;
  limit_req_zone $binary_remote_addr zone=write_zone:10m rate=100r/m;
  limit_req_status 429;

  # LB pool: least_conn spreads k6 VUs across replicas.
  upstream ichiba_backend {
    least_conn;
    server ichiba1:3003 max_fails=3 fail_timeout=10s;
    server ichiba2:3003 max_fails=3 fail_timeout=10s;
  }

  # CDN-lite: cache GET /products/* for 60s (mirrors unstable_cache TTL in catalog.ts).
  proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=ichiba_cache:10m max_size=100m inactive=60s;

  server {
    listen 8080;

    # Never cache writes or health (health drives LB failover decisions).
    location = /api/health {
      limit_req zone=read_zone burst=50 nodelay;
      proxy_pass http://ichiba_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
    }

    location /api/ {
      limit_req zone=write_zone burst=20 nodelay;
      proxy_pass http://ichiba_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
    }

    location / {
      limit_req zone=read_zone burst=100 nodelay;
      proxy_pass http://ichiba_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Cache product/search pages, bypass when response is not 200.
      proxy_cache ichiba_cache;
      proxy_cache_valid 200 60s;
      proxy_cache_valid any 0;
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
